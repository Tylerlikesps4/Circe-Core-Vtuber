name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "circe-android-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm ci
      - name: Bundle persona + typecheck
        run: |
          npm run sync-persona
          npx tsc --noEmit
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install
      - name: Use fixed signing key
        # Release build signs with signingConfigs.debug; point it at the committed keystore
        # (PKCS12, password android, alias androiddebugkey) so updates install over each other.
        run: cp keystore/debug.p12 android/app/debug.keystore
      - name: Ship arm64-v8a libs only
        # Prebuilt AARs (hermes, fbjni, fresco) otherwise pull in x86/armeabi .so files.
        run: sed -i 's/^\(\s*\)defaultConfig {/\1defaultConfig {\n\1    ndk { abiFilters "arm64-v8a" }/' android/app/build.gradle
      - name: Gradle assembleRelease (arm64-v8a, Hermes)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -PhermesEnabled=true
      - name: Name APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="Circe-Core-Android-v${VERSION}-arm64.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: circe-android-apk
          path: |
            mobile/${{ steps.apk.outputs.name }}
            mobile/${{ steps.apk.outputs.name }}.sha256
      - name: Pre-release
        if: startsWith(github.ref, 'refs/tags/circe-android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" "${{ steps.apk.outputs.name }}.sha256" \
            --prerelease --title "Circe-Core Android $GITHUB_REF_NAME" \
            --notes "Circe-Core Android companion (remote + standalone modes). arm64-v8a, signed with the repo's fixed debug key. Not Play-Store signed; sideload only."
